plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.d308vacationproject'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.d308vacationproject"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Core UI libs – use aliases only
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview

    // Lifecycle (LiveData)
    implementation libs.lifecycle.livedata

    // Room – from catalog
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // Testing – use aliases where possible
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.room.testing   // Optional but useful for Room tests
}